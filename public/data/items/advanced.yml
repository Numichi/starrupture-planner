# yaml-language-server: $schema=../schema/items.schema.json
#
# ITEMS – ADVANCED PRODUCTS (Facturer)
#
# Sources: docs/DATA-SOURCES.md. Names in English,
# exactly as in the game. Every recipe value is items/min for one building; the comment
# holds the per-cycle source data (x items / s). Fields: docs/CONFIGURATION.md.

biofilament:
  name: Biofilament
  icon: items/biofilament.png
  color: '#a26d63'
  short: Bi
  recipes:
    # Unlock at the Recipe Station: Superconductor x100, Synthetic Protein x400, RNA Stabilizer x300, Substance #FHS-135-493 x800, Data Point x8000
    - id: biofilament_facturer
      building: facturer
      input: { synthetic_protein: 3.75, rna_stabilizer: 3.75, substance_fhs_135_493: 7.5, nanofiber: 15, superconductor: 3.75 }
      output: 3.75
      # Facturer: x1 / 16 s

