      building: pressurizer
      input: { sulfur_ore: 240, chemicals: 120 }
      output: 120
      # Pressurizer: x4 / 2 s
    - id: sulfuric_acid_compounder_v2
      building: compounder_v2
      input: { sulfur_ore: 240, chemicals: 180 }
      output: 240
      # Compounder v.2: x8 / 2 s

