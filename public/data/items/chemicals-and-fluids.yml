# yaml-language-server: $schema=../schema/items.schema.json
#
# ITEMS – CHEMICALS AND FLUIDS
#
# Sources: docs/DATA-SOURCES.md. Names in English,
# exactly as in the game. Every recipe value is items/min for one building; the comment
# holds the per-cycle source data (x items / s). Fields: docs/CONFIGURATION.md.
#
# An item without a recipe comes from a mine (buildings/extraction.yml), or there is no
# data yet about the building that makes it – then bring it with a Receiver or an incoming rail.

chemicals:
  name: Chemicals
  icon: items/chemicals.png
  color: '#b0471c'
  short: Ch
  recipes:
    # Unlock at the Recipe Station: Chemicals - Blueprint x1, Synthetic Silicon x600, Wolfram Powder x1000, Helium-3 x2000, Data Point x800
    - id: chemicals_furnace
      building: furnace
      input: { synthetic_silicon: 30, wolfram_powder: 90, helium_3: 30 }
      output: 120
      # Furnace: x4 / 2 s
    - id: chemicals_furnace_v2
      building: furnace_v2
      input: { synthetic_silicon: 30, wolfram_powder: 150, helium_3: 60 }
      output: 240
      # Furnace v.2: x8 / 2 s
    - id: chemicals_furnace_v2_goethite
      name: Chemicals (Goethite)
      building: furnace_v2
      input: { calcium_powder: 30, wolfram_powder: 60, helium_3: 120, goethite_ingot: 30 }
      output: 480
      # Furnace v.2: x16 / 2 s

sulfuric_acid:
  name: Sulfuric Acid
  icon: items/sulfuric_acid.png
  color: '#b2711b'
  short: SA
  recipes:
