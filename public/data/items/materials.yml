# yaml-language-server: $schema=../schema/items.schema.json
#
# ITEMS – BASIC MATERIALS AND INTERMEDIATE PRODUCTS
#
# Sources: docs/DATA-SOURCES.md. Names in English,
# exactly as in the game. Every recipe value is items/min for one building; the comment
# holds the per-cycle source data (x items / s). Fields: docs/CONFIGURATION.md.
#
# An item without a recipe comes from a mine (buildings/extraction.yml), or there is no
# data yet about the building that makes it – then bring it with a Receiver or an incoming rail.

basic_building_material:
  name: Basic Building Material
  icon: items/basic_building_material.png
  color: '#7a7a7a'
  short: BBM
  recipes:
    # Unlock at the Recipe Station: Basic Building Material x100, Meteorite Heart x1, Data Point x100
    - id: basic_building_material_fabricator
      building: fabricator
      input: { wolfram_ore: 30, titanium_ore: 30 }
      output: 300
      # Fabricator: x10 / 2 s

