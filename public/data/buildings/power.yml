# yaml-language-server: $schema=../schema/buildings.schema.json
#
# BUILDINGS – POWER (generators)
#
# Sources: docs/DATA-SOURCES.md. Names in English,
# exactly as in the game. Fields: docs/CONFIGURATION.md. In short:
#   power: MW / building (negative = produces) · cost: build cost / building (pieces)
#   upgradeOf: upgraded variant (↑) (a placed node on the graph can be upgraded to it)
#   inheritRecipes: true = also runs the recipes of the base building (the StarRupture v.2
#   buildings have their own recipe lists, so it is switched on nowhere here)
#
# Negative power = produces. Only the name and the output are known (the source list page);
# not wired in yet: the planner shows the power demand, it does not plan the generators.

chemical_generator:
  name: Chemical Generator
  power: -8200

solar_generator_v1:
  name: Solar Generator v.1
  power: -10
  icon: buildings/solar_generator_v1.png

solar_generator_v2:
  name: Solar Generator v.2
  upgradeOf: solar_generator_v1
  power: -140
  icon: buildings/solar_generator_v2.png

wind_turbine_v1:
  name: Wind Turbine v.1
  power: -1200

wind_turbine_v2:
  name: Wind Turbine v.2
  upgradeOf: wind_turbine_v1
  power: -3200
