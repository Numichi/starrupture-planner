# Nginx beállítás a buildelt apphoz (Dockerfile másolja be).
# A program statikus: index.html + assets/ + data/ (YAML) + icons/.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/yaml image/svg+xml;

    # Buildelt JS/CSS: a fájlnévben hash van, sokáig gyorsítótárazható.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Adatfájlok: a .yml-t az nginx alapból nem ismeri, ezért text/yaml.
    # no-cache: a felület "Újratöltés" gombja mindig a friss fájlt kapja.
    location /data/ {
        default_type text/yaml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
